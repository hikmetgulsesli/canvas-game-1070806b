<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white">
  <div data-surface-id="SURF_PLAY_PAGE" data-route="/play" class="flex-1 flex flex-col w-full min-h-screen" data-setfarm-element-ref="E000001">
    <!-- Header bar -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur px-8 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/20 text-white font-bold text-xl">
          PA
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white">Pixel Arcade</h1>
          <p class="text-xs text-slate-400">Browser Canvas Game — Route: /play</p>
        </div>
      </div>

      <div class="flex items-center space-x-4">
        <!-- High Score Display Surface -->
        <div data-surface-id="SURF_HIGH_SCORE_DISPLAY" class="bg-slate-800/80 border border-slate-700/80 rounded-xl px-5 py-2.5 flex flex-col items-center min-w-[120px]" data-setfarm-element-ref="E000002">
          <span class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase">High Score</span>
          <span class="text-2xl font-black text-amber-400 tracking-tight" data-value="0">0</span>
        </div>

        <!-- Score Display Surface -->
        <div data-surface-id="SURF_SCORE_DISPLAY" class="bg-slate-800/80 border border-slate-700/80 rounded-xl px-5 py-2.5 flex flex-col items-center min-w-[120px]" data-setfarm-element-ref="E000003">
          <span class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase">Score</span>
          <span class="text-2xl font-black text-emerald-400 tracking-tight" data-value="0">0</span>
        </div>
      </div>
    </header>

    <!-- Main Game Section -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-6 py-8 flex flex-col items-center justify-center space-y-6">
      <!-- Game Canvas Surface -->
      <div data-surface-id="SURF_GAME_CANVAS" class="relative w-full aspect-[16/9] max-h-[580px] bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col items-center justify-center" data-setfarm-element-ref="E000004">
        <!-- Subtle canvas background grid -->
        <div class="absolute inset-0 bg-[radial-gradient(#334155_1px,transparent_1px)] [background-size:24px_24px] opacity-25"></div>

        <div class="relative z-10 flex flex-col items-center text-center p-8 space-y-4">
          <div class="w-16 h-16 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <rect x="2" y="3" width="20" height="14" rx="2" stroke-width="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21" stroke-width="2"></line>
              <line x1="12" y1="17" x2="12" y2="21" stroke-width="2"></line>
            </svg>
          </div>
          <div>
            <h2 class="text-2xl font-bold text-white">Game Stage Ready</h2>
            <p class="text-sm text-slate-400 max-w-md mt-1">Press the Start button below to launch the canvas engine and commence gameplay.</p>
          </div>
        </div>

        <!-- Canvas bottom metadata indicators -->
        <div class="absolute bottom-4 left-6 text-[11px] text-slate-500 font-mono">
          CANVAS: 1280 × 720
        </div>
        <div class="absolute bottom-4 right-6 text-[11px] text-slate-500 font-mono">
          FPS: 60
        </div>
      </div>

      <!-- Controls and Status Deck -->
      <div class="w-full flex items-center justify-between bg-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-lg backdrop-blur">
        <!-- Status Panel Surface -->
        <div data-surface-id="SURF_STATUS_PANEL" class="flex items-center space-x-3 px-4 py-2 bg-slate-950/60 rounded-xl border border-slate-800/80" data-setfarm-element-ref="E000005">
          <span class="relative flex h-3 w-3">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
          </span>
          <div class="text-sm font-medium text-slate-300">
            Status: <span class="text-emerald-400 font-semibold">Game started</span>
          </div>
        </div>

        <!-- The declared Start Game button -->
        <div>
          <button type="button" data-action="ACT_START_GAME" data-control-slot="CSLOT_START_GAME_START_BUTTON_PLACEMENT" class="inline-flex items-center justify-center space-x-2 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold px-8 py-3.5 rounded-xl shadow-lg shadow-indigo-600/30 transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-950 cursor-pointer" data-setfarm-element-ref="E000006">
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z"></path>
            </svg>
            <span>Start Game</span>
          </button>
        </div>
      </div>
    </main>

    <!-- Footer decoration without actionable links -->
    <footer class="py-6 border-t border-slate-900 text-center text-xs text-slate-600">
      <p>© 2025 Browser Canvas Game. All rights reserved.</p>
    </footer>
  </div>

</body></html>
